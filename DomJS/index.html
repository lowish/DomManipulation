<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>  
<h1>Generators</h1>

<!-- Generator EmailUsername  -->
<section>
<h2>Username</h2>
    <input type="text" id="nameInput" placeholder="Enter your name" />
    <button id="generateEmailButton">Apply</button>
    <p id="emailResult"></p>
</section>


<!-- Generator Password -->
<section>
<h2>Password</h2>
<label for="lengthInput">Password Length:</label>
<input type="number" id="lengthInput">
<label for="uppercaseCheckbox">Include Uppercase Letters:</label>
<input type="checkbox" id="uppercaseCheckbox">
<label for="numbersCheckbox">Include Numbers:</label>
<input type="checkbox" id="numbersCheckbox">
<label for="symbolsCheckbox">Include Symbols:</label>
<input type="checkbox" id="symbolsCheckbox">
<button id="generateButton">Apply</button>
<p id="passwordResult"></p>
<section>


<!-- Generator Quote  -->
<section>
<h2>Quote</h2>
    <button id="quoteButton">Generate Quote</button>
    <p id="quoteText"></p>
</section>



<!-- Generator Number  -->

<section>
<h2>Number</h2>
    <button id="odd">Odd</button>
    <button id="even">Even</button>
    <button id="reset">Reset</button>
    <p id="oddResult"></p>
    <p id="evenResult"></p>
</section>

<!-- Generator Emoji  -->
<section>
    <h2>Emoji</h2>
    <button id="emojiButton">Generate Emoji</button>
    <p id="emoji"></p>
</section>

<!-- Generator Color  -->
<section>
    <h2>Background Color</h2>
    <button id="colorButton">Select Color</button>
    <p id="colorResult"></p>
</section>

<script src="script.js"></script>
</body>
</html>
